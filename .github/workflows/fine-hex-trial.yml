name: Finer hexes trial (no publishing)

# Builds places with more, smaller hexes and keeps the files as a download for testing.
# Nothing is committed to the site.
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Places to build, comma-separated, like mexico-city,bologna"
        required: true
      max_hexes:
        description: "Most hexes per place"
        required: true
        default: "18000"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.p.outputs.slugs }}
    steps:
      - id: p
        env:
          SLUGS: ${{ inputs.slugs }}
        run: echo "slugs=$(python3 -c 'import json,os; print(json.dumps([s.strip() for s in os.environ["SLUGS"].split(",") if s.strip()]))')" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.slugs) }}
    env:
      TL_MAX_HEXES: ${{ inputs.max_hexes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/cache@v4
        with:
          path: cache/hybas_*.zip
          key: hydrobasins-lev08-v1
      - run: python3 pipeline/library.py build "${{ matrix.slug }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fine-${{ matrix.slug }}
          path: out/
          retention-days: 14
  save:
    # Keep the trial files on a side branch (the site is published from main only)
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: fine-*
          path: trial
      - run: |
          mkdir -p fine
          for d in trial/fine-*; do cp "$d"/*.json fine/ 2>/dev/null || true; mkdir -p fine/logs; cp "$d"/logs/*.txt fine/logs/ 2>/dev/null || true; done
          git config user.name "threadlands-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan trial-fine-hexes
          git rm -rq --cached . && git clean -fdq -e fine
          git add fine && git commit -qm "Finer hexes trial ${{ github.run_id }}" && git push -f origin trial-fine-hexes
