name: Idea reviewed
# When an idea issue gets "publish", add it to data/proposals.json. A "join" is added to the idea it joins,
# keeping its own area, pin and reason; a "connect" becomes its own idea with a link.
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
jobs:
  publish:
    if: github.event.label.name == 'publish' && contains(github.event.issue.labels.*.name, 'proposal')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add the idea
        env:
          BODY: ${{ github.event.issue.body }}
          NUM: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PY'
          import json, os, re, datetime
          m = re.search(r'```json\s*(\{.*?\})\s*```', os.environ['BODY'], re.S)
          o = json.loads(m.group(1))
          today = datetime.date.today().isoformat()
          path = 'data/proposals.json'
          d = json.load(open(path)) if os.path.exists(path) else {'proposals': []}
          P = d.setdefault('proposals', [])
          target = next((p for p in P if p.get('id') == o.get('link_id')), None) if o.get('mode') == 'join' else None
          if target is not None:
              j = target.setdefault('joined', [])
              j[:] = [x for x in j if x.get('from') != 'i' + os.environ['NUM']]
              j.append({'from': 'i' + os.environ['NUM'], 'area': o.get('area', ''), 'lat': o.get('lat'), 'lng': o.get('lng'), 'why': o.get('why', ''), 'added': today})
          else:
              keep = {k: o.get(k) for k in ['place', 'idea', 'why', 'area', 'scope', 'topic', 'lat', 'lng']}
              keep['id'] = 'i' + os.environ['NUM']
              keep['links'] = [{'kind': o['link_kind'], 'id': o['link_id']}] if o.get('link_kind') and o.get('link_id') else []
              keep['joined'] = []
              keep['added'] = today
              P[:] = [x for x in P if x.get('id') != keep['id']] + [keep]
          json.dump(d, open(path, 'w'), indent=1, ensure_ascii=False)
          PY
      - name: Commit
        run: |
          git config user.name "threadlands-bot"
          git config user.email "threadlands-bot@users.noreply.github.com"
          git add data/proposals.json
          git commit -m "Add idea from issue #${{ github.event.issue.number }}" || exit 0
          git pull --rebase origin main && git push
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: 'Published on the place page. Thank you!' });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed' });
