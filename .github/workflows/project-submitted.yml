name: Project submitted
# A visitor proposed a real project on the website. The relay sends it here; this opens an issue for review.
# Nothing is published until the issue is labelled "approved" (see project-approved.yml).
on:
  repository_dispatch:
    types: [project-submitted]
permissions:
  issues: write
jobs:
  open-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const p = context.payload.client_payload.project || {};
            const body = [
              '**A visitor proposed a project for the Threadlands map.**',
              '',
              `- Place: ${p.place}`,
              `- Name: ${p.name}`,
              `- Type: ${p.kind} · Status: ${p.status} · Year: ${p.year || ''}`,
              `- Who is behind it: ${p.who || ''}`,
              `- Where: ${p.lat}, ${p.lng} (https://www.openstreetmap.org/?mlat=${p.lat}&mlon=${p.lng}#map=16/${p.lat}/${p.lng})`,
              `- Source: ${p.source_url}`,
              `- Get involved: ${p.involved || ''}`,
              '',
              p.summary || '',
              '',
              'To publish it, check the source, edit the JSON below if needed, and add the label **approved**. To reject it, close the issue.',
              '',
              '```json',
              JSON.stringify(p, null, 2),
              '```'
            ].join('\n');
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
              title: `Project: ${String(p.name || '').slice(0, 80)} (${p.place})`, body, labels: ['project-submission'] });
