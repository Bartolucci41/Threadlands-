name: Daily news
# Gathers the latest flood, heat, drought, fire and city-greening headlines for each library place (Google News) into data/news.json.
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      max_places:
        description: "Only the first N places (0 = all)"
        default: "0"
permissions:
  contents: write
concurrency: news
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 pipeline/news.py "${{ github.event.inputs.max_places || '0' }}"
      - name: Commit
        run: |
          git config user.name "threadlands-bot"
          git config user.email "threadlands-bot@users.noreply.github.com"
          git add data/news.json
          git commit -m "Daily news" || exit 0
          git pull --rebase origin main && git push
