name: Build city library

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pipeline/cities.txt
      - pipeline/run_place.py
      - pipeline/library.py

permissions:
  contents: write

concurrency:
  group: city-library
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: plan
        run: python3 pipeline/library.py plan 6 >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.chunks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/cache@v4
        with:
          path: cache/hybas_*.zip
          key: hydrobasins-lev08-v1
      - run: python3 pipeline/library.py build "${{ matrix.chunk }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: places-${{ strategy.job-index }}
          path: out/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: places-*
          path: out
          merge-multiple: true
      - run: python3 pipeline/library.py publish
      - name: Commit new places
        run: |
          git config user.name "threadlands-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "City library: add places built by the robot"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 10; done
