name: Search check
# Runs the same OpenStreetMap search the Explore page uses, for a handful of real names, and prints what comes back:
# type, country, whether there is a boundary outline. A live check of the "build a place" search, run by hand.
on:
  push:
    branches: [main]
    paths: ['.github/search-names.txt']
  workflow_dispatch:
    inputs:
      names:
        description: 'Names to search, separated by |'
        default: 'Toluca|Marin County|Lombardy|Iztapalapa|Valle de Bravo|Lagos|Kibera|Starbucks Seattle|Golden Gate Bridge'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search
        env:
          NAMES: ${{ github.event.inputs.names }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          out = []
          names = os.environ.get('NAMES') or open('.github/search-names.txt').read().strip()
          for q in names.split('|'):
              u = 'https://nominatim.openstreetmap.org/search?' + urllib.parse.urlencode({'format': 'jsonv2', 'addressdetails': 1, 'limit': 8, 'accept-language': 'en', 'featureType': 'settlement', 'polygon_geojson': 1, 'polygon_threshold': 0.01, 'q': q})
              req = urllib.request.Request(u, headers={'User-Agent': 'Threadlands search check (threadlands.org)'})
              hits = json.load(urllib.request.urlopen(req, timeout=30))
              out.append(f'## {q}: {len(hits)} result(s)')
              for h in hits:
                  a = h.get('address') or {}; g = (h.get('geojson') or {}).get('type', '-')
                  out.append(f"- {h.get('name')} | {h.get('addresstype')} | {a.get('state') or a.get('county') or ''} | {a.get('country')} | {h.get('osm_type')}/{h.get('osm_id')} | {'outline' if 'Polygon' in g else 'point only'}")
              time.sleep(1.2)   # Nominatim's usage policy: at most one request a second
          text = '\n'.join(out); print(text)
          open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(text + '\n')
          os.makedirs('checks', exist_ok=True); open('checks/search-check.md', 'w').write(text + '\n')
          PY
      - name: Save the result
        run: |
          git config user.name "threadlands-bot"
          git config user.email "threadlands-bot@users.noreply.github.com"
          git add checks/search-check.md
          git commit -m "Search check result" || exit 0
          git pull --rebase origin main && git push
