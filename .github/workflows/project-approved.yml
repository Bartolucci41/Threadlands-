name: Project approved
# When a project-submission issue gets the "approved" label, add it to data/projects.json and close the issue.
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
jobs:
  publish:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'project-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add the project
        env:
          BODY: ${{ github.event.issue.body }}
          NUM: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PY'
          import json, os, re
          body = os.environ['BODY']
          m = re.search(r'```json\s*(\{.*?\})\s*```', body, re.S)
          p = json.loads(m.group(1))
          keep = {k: p.get(k) for k in ['place','name','kind','status','year','lat','lng','area_km2','who','summary','involved']}
          keep['id'] = 'v' + os.environ['NUM']
          keep['source'] = {'title': p.get('source_title') or p.get('source_url'), 'url': p.get('source_url')}
          keep['added_by_visitor'] = True
          import datetime; keep['added'] = datetime.date.today().isoformat()
          d = json.load(open('data/projects.json'))
          d['projects'] = [x for x in d['projects'] if x.get('id') != keep['id']] + [keep]
          json.dump(d, open('data/projects.json', 'w'), indent=2, ensure_ascii=False)
          PY
      - name: Update the ranking with the new project
        run: node pipeline/profile_dist.js
      - name: Commit
        run: |
          git config user.name "threadlands-bot"
          git config user.email "threadlands-bot@users.noreply.github.com"
          git add data/projects.json data/ranking.json data/profile-dist.json data/summary.json
          git commit -m "Add project from issue #${{ github.event.issue.number }}" || exit 0
          git pull --rebase origin main && git push
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: 'Published on the Threadlands map. Thank you!' });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed' });
