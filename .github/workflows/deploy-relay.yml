name: Deploy relay
# Puts relay/worker.js live on Cloudflare whenever it changes, so no one has to paste code into the dashboard.
# Needs three repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, RELAY_KV_ID. Without them it skips.
on:
  push:
    branches: [main]
    paths: ['relay/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: deploy-relay, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets are set
        id: ok
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          K: ${{ secrets.RELAY_KV_ID }}
        run: |
          if [ -n "$T" ] && [ -n "$A" ] && [ -n "$K" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "Cloudflare secrets not set yet; skipping the deploy."; fi
      - name: Fill in the storage ID
        if: steps.ok.outputs.go == '1'
        env:
          K: ${{ secrets.RELAY_KV_ID }}
        run: sed -i "s/KV_ID_FROM_GITHUB_SECRET/$K/" relay/wrangler.toml
      - name: Deploy
        if: steps.ok.outputs.go == '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          command: deploy
      - name: Check it answers
        if: steps.ok.outputs.go == '1'
        run: |
          sleep 5
          curl -fsS "https://threadlands-relay.rob41pitt.workers.dev/?features=1" | tee /dev/stderr | grep -q '"ideas":true'
