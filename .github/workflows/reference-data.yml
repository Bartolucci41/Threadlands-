name: Reference data

on:
  workflow_dispatch:
  schedule:
    - cron: "41 8 3 * *"   # monthly
  push:
    branches: [main]
    paths:
      - pipeline/refdata.py
      - .github/workflows/reference-data.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: pip install pycountry requests
      - run: python3 pipeline/refdata.py
      - run: python3 pipeline/library.py publish
      - name: Commit
        run: |
          git config user.name "threadlands-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Reference data: country codes and price levels"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; sleep 10; done
