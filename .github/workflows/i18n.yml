name: Translations
# Finds any English text on the site that has no translation yet and fills it in for every language,
# with Argos Translate (free, open source). Hand translations are never overwritten.
on:
  push:
    branches: [main]
    paths: ["src/**", "assets/**", "data/projects.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: i18n
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Tools
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          pip install argostranslate==1.9.6
      - name: Find new text on the site
        run: |
          python3 -I src/build_site.py
          (python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          node pipeline/i18n_extract.js http://localhost:8765
      - name: Translate what is missing
        run: python3 pipeline/i18n_translate.py
      - name: Commit
        run: |
          git config user.name "threadlands-bot"
          git config user.email "threadlands-bot@users.noreply.github.com"
          git add data/i18n
          git commit -m "Translations: fill in new text" || exit 0
          git pull --rebase origin main && git push
