name: Translations
# Finds any English text on the site that has no translation yet and fills it in for every language,
# with Argos Translate (free, open source). Hand translations are never overwritten.
on:
  push:
    branches: [main]
    paths: ["src/**", "assets/**", "data/projects.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: i18n
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Tools
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          pip install argostranslate==1.9.6
      - name: Find new text, translate it and save it
        # If another run saved translations first, start again from the newest version
        # (only text still missing is translated, so a second pass is quick).
        run: |
          git config user.name "threadlands-bot"
          git config user.email "threadlands-bot@users.noreply.github.com"
          (python3 -m http.server 8765 >/dev/null 2>&1 &)
          for try in 1 2 3; do
            python3 -I src/build_site.py
            sleep 2
            node pipeline/i18n_extract.js http://localhost:8765
            python3 pipeline/i18n_translate.py
            git add data/i18n
            git commit -q -m "Translations: fill in new text" || { echo "Nothing new to translate."; exit 0; }
            if git pull -q --rebase origin main && git push -q; then echo "Saved."; exit 0; fi
            echo "Someone saved first (try $try). Starting again from the newest version."
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
          done
          echo "Could not save after three tries."; exit 1
