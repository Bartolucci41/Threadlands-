name: Block-level detail

# Splits the hexes inside each place into block-sized cells and measures them from satellite data.
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Places, comma-separated, like mexico-city,bologna"
        required: true

permissions:
  contents: write

concurrency:
  group: detail
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Build and upload each place
        env:
          SLUGS: ${{ inputs.slugs }}
          TL_DATA: https://pub-5cc2f5116c6c462596fbf16596585b83.r2.dev
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ "$SLUGS" = "missing" ]; then LIST=$(python3 pipeline/detail.py --missing); else LIST=$(echo "$SLUGS" | tr ',' ' '); fi
          echo "Places: $(echo $LIST | wc -w)"
          for s in $LIST; do
            python3 pipeline/detail.py "$s" && pipeline/r2_sync.sh "detail/$s" || echo "::warning::$s failed"
            rm -rf "data/detail/$s"
          done
